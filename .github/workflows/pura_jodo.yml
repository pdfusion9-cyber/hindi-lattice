name: pura_jodo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chalao:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          python -m pip install -q numpy tokenizers
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Qwen laao
        run: |
          curl -sL -o m.safetensors https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/model.safetensors
          curl -sL -o tok.json https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/tokenizer.json
      - name: kosh laao
        run: |
          python - <<'PY'
          import urllib.request
          got = ""
          for u in ["https://www.gutenberg.org/files/11/11-0.txt",
                    "https://raw.githubusercontent.com/pdfusion9-cyber/hindi-lattice/main/hindi_corpus.txt"]:
              try:
                  d = urllib.request.urlopen(u, timeout=90).read().decode("utf-8","ignore")
                  if len(d) > 200000:
                      got = d; print("mila:", u, len(d)); break
              except Exception as e:
                  print("skip", type(e).__name__)
          if not got:
              got = "The capital of India is New Delhi. Machine learning is a field of study. Python is a programming language.\n" * 20000
          open("corpus.txt","w",encoding="utf-8").write(got[:8000000])
          print("bytes:", len(got))
          PY
          wc -c corpus.txt
      - name: pura jodo
        run: python pura_jodo.py
