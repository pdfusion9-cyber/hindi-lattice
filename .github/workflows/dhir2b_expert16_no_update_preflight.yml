name: Dhīr-2B Expert 16 No-Update Gradient Preflight

on:
  push:
    branches: [neurocore-v0.3.2-canonical-20261122]
    paths:
      - 'models/neurocore_edge/preflight_dhir2b_expert.py'
      - 'models/neurocore_edge/test_preflight_dhir2b_expert.py'
      - '.github/workflows/dhir2b_expert16_no_update_preflight.yml'
  workflow_dispatch:
    inputs:
      checkpoint_run_id:
        description: Completed workflow run ID containing the verified dhir2b-neurocore-cpu-checkpoint artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  no-update-gradient-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neurocore-v0.3.2-canonical-20261122

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download previously verified Dhīr-2B checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: dhir2b-neurocore-cpu-checkpoint
          run-id: ${{ inputs.checkpoint_run_id || '45780741273' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dhir2b-checkpoint-artifact

      - name: Install CPU-only Dhīr runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r models/neurocore_edge/requirements-dhir2b.txt

      - name: Run preflight unit tests
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile preflight_dhir2b_expert.py test_preflight_dhir2b_expert.py
          python -m unittest -v test_preflight_dhir2b_expert

      - name: Locate checkpoint and run one no-update forward/backward pass
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          CHECKPOINT_MANIFEST="$(find "${{ runner.temp }}/dhir2b-checkpoint-artifact" -name manifest.json -type f -print -quit)"
          test -n "$CHECKPOINT_MANIFEST"
          MODEL_DIR="$(dirname "$CHECKPOINT_MANIFEST")"
          python preflight_dhir2b_expert.py \
            --model-dir "$MODEL_DIR" \
            --data synthetic_sft/expert16_self_correction_train.jsonl \
            --approval dataset_approval.json \
            --output "${{ runner.temp }}/dhir2b-expert16-preflight/report.json" \
            --threads 2

      - name: Upload no-update preflight report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhir2b-expert16-no-update-preflight
          path: ${{ runner.temp }}/dhir2b-expert16-preflight/report.json
          if-no-files-found: ignore
          retention-days: 30
