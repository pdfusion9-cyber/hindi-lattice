name: jodo_qwen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chalao:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          python -m pip install -q numpy tokenizers
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Qwen laao
        run: |
          curl -sL -o m.safetensors https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/model.safetensors
          curl -sL -o tok.json https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/tokenizer.json
      - name: kosh banao
        run: |
          python - <<'PY'
          import urllib.request
          try:
              u="https://raw.githubusercontent.com/pdfusion9-cyber/hindi-lattice/main/hindi_corpus.txt"
              d=urllib.request.urlopen(u,timeout=60).read().decode("utf-8","ignore")
          except Exception:
              d="राम ने रोटी खाई। सीता ने पानी पिया। भारत एक देश है। दिल्ली भारत की राजधानी है।\n"*500
          open("corpus.txt","w",encoding="utf-8").write(d[:3000000])
          print("corpus lines:", len(d.split(chr(10))))
          PY
          wc -l corpus.txt
      - name: jodo aur chalao
        run: python jodo_qwen.py
