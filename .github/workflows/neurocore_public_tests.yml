name: NeuroCore Reference Model Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'models/neurocore_edge/**'
      - '.github/workflows/neurocore_public_tests.yml'
  push:
    branches: [main]
    paths:
      - 'models/neurocore_edge/**'
      - '.github/workflows/neurocore_public_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6'
          python -m pip install pytest
      - name: Compile reference source
        run: python -m py_compile models/neurocore_edge/*.py
      - name: Run tiny reference-model tests
        working-directory: models/neurocore_edge
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python -m pytest -q test_reference_model.py
      - name: Run synthetic-only end-to-end training and resume test
        working-directory: models/neurocore_edge
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python synthetic_training_smoke.py --report-path synthetic_training_report.json --steps 40
          python -m pytest -q test_synthetic_training_smoke.py
      - name: Upload synthetic training report
        uses: actions/upload-artifact@v4
        with:
          name: neurocore-synthetic-training-smoke
          path: models/neurocore_edge/synthetic_training_report.json
          if-no-files-found: error
      - name: Run synthetic Hindi byte-level baseline
        working-directory: models/neurocore_edge
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python hindi_synthetic_baseline.py --report-path hindi_synthetic_report.json --steps 160
          python -m pytest -q test_hindi_synthetic_baseline.py
      - name: Upload Hindi synthetic baseline report
        uses: actions/upload-artifact@v4
        with:
          name: neurocore-hindi-synthetic-baseline
          path: models/neurocore_edge/hindi_synthetic_report.json
          if-no-files-found: error
      - name: Run dataset schema adapter tests
        working-directory: models/neurocore_edge
        run: python -m pytest -q test_dataset_schema_adapters.py
      - name: Run corpus builder gate tests
        working-directory: models/neurocore_edge
        run: python -m pytest -q test_prepare_expert_corpus.py
      - name: Validate fail-closed dataset approval policy
        working-directory: models/neurocore_edge
        run: |
          python dataset_approval_policy.py --report-path dataset_approval_policy_report.json
          python -m pytest -q test_dataset_approval_policy.py
      - name: Upload dataset approval policy report
        uses: actions/upload-artifact@v4
        with:
          name: neurocore-dataset-approval-policy
          path: models/neurocore_edge/dataset_approval_policy_report.json
          if-no-files-found: error
      - name: Audit Hugging Face dataset metadata, splits and sample schemas
        working-directory: models/neurocore_edge
        run: python verify_dataset_metadata.py
      - name: Upload dataset verification report
        uses: actions/upload-artifact@v4
        with:
          name: neurocore-dataset-verification
          path: models/neurocore_edge/dataset_verification_report.json
          if-no-files-found: error
      - name: Build human dataset review matrix
        working-directory: models/neurocore_edge
        run: |
          python build_dataset_review_matrix.py --report-path dataset_review_matrix_report.json
          python -m pytest -q test_build_dataset_review_matrix.py
      - name: Validate external dataset rights triage
        working-directory: models/neurocore_edge
        run: python -m pytest -q test_external_dataset_rights_review.py
      - name: Generate human dataset review workflow packet
        working-directory: models/neurocore_edge
        run: |
          python dataset_review_workflow.py --output dataset_human_review_packet.json
          python -m pytest -q test_dataset_review_workflow.py
      - name: Upload human dataset review workflow packet
        uses: actions/upload-artifact@v4
        with:
          name: neurocore-human-dataset-review-packet
          path: models/neurocore_edge/dataset_human_review_packet.json
          if-no-files-found: error
      - name: Upload dataset review matrix
        uses: actions/upload-artifact@v4
        with:
          name: neurocore-dataset-review-matrix
          path: models/neurocore_edge/dataset_review_matrix_report.json
          if-no-files-found: error
      - name: Verify training and dataset gates remain closed
        run: |
          python - <<'PY'
          import json
          p=json.load(open("models/neurocore_edge/config.json"))
          assert p["status"] == "UNTRAINED_INITIALIZATION_ONLY"
          assert p["training"]["enabled"] is False
          assert p["num_experts"] == 20 and p["experts_per_token"] == 2
          d=json.load(open("models/neurocore_edge/dataset_approval.json"))
          assert d["status"] == "ALL_DATASETS_PENDING_REVIEW"
          assert all(row["approved"] is False for row in d["datasets"])
          print("REFERENCE_CONFIG_AND_DATASET_GATE_PASS")
          PY
