name: NeuroCore Canonical Reference Tests

on:
  push:
    branches: [main, neurocore-v0.3.2-canonical-20261122]
    paths:
      - 'models/neurocore_edge/**'
      - '.github/workflows/neurocore_public_tests.yml'
  pull_request:
    paths:
      - 'models/neurocore_edge/**'
      - '.github/workflows/neurocore_public_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6'
          python -m pip install pytest
      - name: Compile model source
        run: python -m py_compile models/neurocore_edge/*.py
      - name: Install Dhīr adapter import dependencies
        run: python -m pip install 'transformers>=4.57.3,<5' 'safetensors>=0.4.5'
      - name: Compile Dhīr NeuroCore tokenizer, benchmark and adapter entrypoints
        run: python -m py_compile models/neurocore_edge/neurocore_tokenizer.py models/neurocore_edge/test_neurocore_tokenizer.py models/neurocore_edge/benchmark_neurocore_tokenizer.py models/neurocore_edge/test_benchmark_neurocore_tokenizer.py models/neurocore_edge/dhir2b_neurocore.py models/neurocore_edge/import_dhir2b_weights.py models/neurocore_edge/train_dhir2b_expert.py models/neurocore_edge/test_dhir2b_neurocore.py
      - name: Run NeuroCore tokenizer compatibility tests
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_neurocore_tokenizer test_benchmark_neurocore_tokenizer
      - name: Compile and test unified NeuroCore inference runner
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile neurocore_inference.py test_neurocore_inference.py
          python -m unittest -v test_neurocore_inference
      - name: Run Dhīr NeuroCore CPU adapter tests
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python -m unittest -v test_dhir2b_neurocore
      - name: Validate synthetic Hindi SFT pilot datasets
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile test_neurocore_synthetic_sft_datasets.py
          python -m unittest -v test_neurocore_synthetic_sft_datasets
      - name: Compile and test actual Dhīr tokenizer SFT dry-run
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HOME: ${{ runner.temp }}/hf-cache
        run: |
          python -m py_compile dryrun_synthetic_dhir2b_sft.py test_dryrun_synthetic_dhir2b_sft.py
          python -m unittest -v test_dryrun_synthetic_dhir2b_sft
          python dryrun_synthetic_dhir2b_sft.py \
            --tokenizer-dir "${{ runner.temp }}/dhir-neurocore-tokenizer" \
            --output "${{ runner.temp }}/neurocore-synthetic-sft-dryrun/report.json"
      - name: Upload aggregate dry-run report only
        uses: actions/upload-artifact@v4
        with:
          name: neurocore-synthetic-sft-tokenizer-dryrun
          path: ${{ runner.temp }}/neurocore-synthetic-sft-dryrun/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Compile and test Dhīr Expert 11 training gates
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile train_dhir2b_expert.py test_train_dhir2b_expert.py
          python -m unittest -v test_train_dhir2b_expert
      - name: Compile and test private Hindi corpus preparation gate
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile prepare_dhir2b_expert_corpus.py test_prepare_dhir2b_expert_corpus.py
          python -m unittest -v test_prepare_dhir2b_expert_corpus
      - name: Compile and test Dhīr-2B Expert 16 no-update preflight gates
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile preflight_dhir2b_expert.py test_preflight_dhir2b_expert.py
          python -m unittest -v test_preflight_dhir2b_expert
      - name: Compile canonical teacher assimilation entrypoints
        run: python -m py_compile models/neurocore_edge/teacher_weight_assimilation.py models/neurocore_edge/train_teacher_assimilated_expert.py models/neurocore_edge/test_teacher_weight_assimilation.py
      - name: Run base distillation resume and provenance tests
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python -m unittest -v test_teacher_base_distillation
      - name: Compile full base distillation entrypoints
        run: python -m py_compile models/neurocore_edge/teacher_base_distillation.py models/neurocore_edge/test_teacher_base_distillation.py
      - name: Run full base distillation tests
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python -m unittest -v test_teacher_base_distillation
      - name: Run canonical teacher assimilation tests
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python -m unittest -v test_teacher_weight_assimilation
      - name: Run reference-model tests
        env:
          PYTHONPATH: models/neurocore_edge
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          if [ -d models/neurocore_edge/tests ]; then
            python -m pytest -q models/neurocore_edge/tests
          else
            python -m pytest -q models/neurocore_edge/test_reference_model.py
          fi
      - name: Run canonical architecture and budget audit tests
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v test_canonical_architecture_audit
          python -m unittest -v test_count_canonical_parameters
      - name: Run Sangraha bounded audit unit tests
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_audit_sangraha_hindi_sample
      - name: Run tokenizer provenance gate tests
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_train_neurocore_tokenizer
      - name: Verify full canonical parameter count on meta device
        run: python models/neurocore_edge/count_canonical_parameters.py --repo-root .
      - name: Report current canonical readiness blockers
        run: python models/neurocore_edge/canonical_architecture_audit.py --repo-root .
      - name: Verify default-deny gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("models/neurocore_edge/config.json").read_text())
          assert p["status"] == "UNTRAINED_INITIALIZATION_ONLY"
          assert p["training"]["enabled"] is False
          assert p["training"]["quantization_enabled"] is False
          assert p["num_experts"] == 20 and p["experts_per_token"] == 2
          assert p["expected_total_parameters"] == 3074921472
          d=json.loads(Path("models/neurocore_edge/dataset_approval.json").read_text())
          assert d["status"] == "ALL_DATASETS_PENDING_REVIEW"
          assert not d["approved_training_artifacts"] and not d["approved_tokenizers"]
          assert all(row["approved"] is False for row in d["datasets"])
          print("CANONICAL_CONFIG_AND_DEFAULT_DENY_GATES_PASS")
          PY
