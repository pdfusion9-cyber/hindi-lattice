name: NeuroCore Micro-Agent Managed Synthetic Training Pilot

on:
  pull_request:
    branches: [main]
    paths:
      - 'models/neurocore_edge/**'
      - '.github/workflows/neurocore_micro_agent_training.yml'
  push:
    branches: [main]
    paths:
      - 'models/neurocore_edge/**'
      - '.github/workflows/neurocore_micro_agent_training.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-synthetic-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6'
          python -m pip install pytest
      - name: Compile native NeuroCore and micro-agent training controller
        run: python -m py_compile models/neurocore_edge/*.py
      - name: Test training governance, budget and external-weight rejection
        working-directory: models/neurocore_edge
        run: python -m pytest -q test_training_micro_agents.py -k 'not managed_training'
      - name: Start bounded native NeuroCore synthetic training under micro-agent control
        working-directory: models/neurocore_edge
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python training_micro_agents.py --report-path micro_agent_training_report.json --steps 40 --max-steps 40
          python -m pytest -q test_training_micro_agents.py -k managed_training
      - name: Assert external models and production datasets remain excluded
        working-directory: models/neurocore_edge
        run: |
          python - <<'PY'
          import json
          r=json.load(open("micro_agent_training_report.json"))
          assert r["training_started"] is True
          assert r["model_under_test"] == "native_neurocore_reference"
          assert r["open_source_model_integrated"] is False
          assert r["external_model_weights_used"] is False
          assert r["provenance"]["external_data_used"] is False
          assert r["production_training_gate"] == "CLOSED"
          c=json.load(open("config.json"))
          assert c["training"]["enabled"] is False
          d=json.load(open("dataset_approval.json"))
          assert d["status"] == "ALL_DATASETS_PENDING_REVIEW"
          assert all(row["approved"] is False for row in d["datasets"])
          print("MICRO_AGENT_MANAGED_SYNTHETIC_TRAINING_PASS; PRODUCTION_GATES_STAY_CLOSED")
          PY
      - name: Upload managed synthetic training report
        uses: actions/upload-artifact@v4
        with:
          name: neurocore-micro-agent-managed-synthetic-pilot
          path: models/neurocore_edge/micro_agent_training_report.json
          if-no-files-found: error
          retention-days: 14
