name: chakra-merge-smoke-once
on:
  workflow_run:
    workflows: ["chakra_loop"]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: read
jobs:
  merge-and-smoke:
    if: github.event.workflow_run.run_number == 41 && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dependencies and syntax check
        run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m py_compile tools/merge_chakra.py tools/smoke_merged.py
      - name: download, merge, and delete each domain checkpoint sequentially
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out checkpoints
          for d in science math reasoning news qa general coding document history geography; do
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "chakra-$d" --dir "checkpoints/$d"
            test -s "checkpoints/$d/ckpt/sampurna.pt" || { echo "Missing checkpoint: $d"; exit 1; }
            python tools/merge_chakra.py --input "checkpoints/$d/ckpt/sampurna.pt" --state out/merge_state.pt --domain "$d"
            rm -rf "checkpoints/$d"
          done
          python tools/merge_chakra.py --finalize-only --state out/merge_state.pt --final-output out/merged_model.pt --report out/merge_report.json
          test -s out/merged_model.pt
      - name: strict-load and forward-pass smoke test
        run: |
          set -euo pipefail
          python tools/smoke_merged.py --ckpt out/merged_model.pt --out out/smoke_report.json
      - name: publish experimental merged model and reports
        uses: actions/upload-artifact@v4
        with:
          name: chakra41-merged-experimental
          path: |
            out/merged_model.pt
            out/merge_report.json
            out/smoke_report.json
          retention-days: 90
