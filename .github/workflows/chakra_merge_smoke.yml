name: chakra-merge-smoke
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chakra_merge_smoke.yml"
      - "tools/merge_chakra.py"
      - "tools/smoke_merged.py"
  workflow_run:
    workflows: ["chakra_loop"]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: read
concurrency:
  group: chakra-merge-smoke-main
  cancel-in-progress: false
jobs:
  merge-and-smoke:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dependencies and syntax check
        run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m py_compile tools/merge_chakra.py tools/smoke_merged.py
      - name: select latest successful CHAKRA run
        id: source
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow chakra_loop --status completed --json databaseId,conclusion,createdAt --limit 30 | python -c 'import json,sys; a=[x for x in json.load(sys.stdin) if x["conclusion"]=="success"]; a.sort(key=lambda x:x["createdAt"],reverse=True); print(a[0]["databaseId"] if a else "")')"
          test -n "$RUN_ID" || { echo "No successful CHAKRA run found"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Selected CHAKRA run: $RUN_ID"
      - name: download, verify, and merge all ten checkpoints sequentially
        env:
          RUN_ID: \${{ steps.source.outputs.run_id }}
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out checkpoints
          for d in science math reasoning news qa general coding document history geography; do
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "chakra-$d" --dir "checkpoints/$d"
            test -s "checkpoints/$d/ckpt/sampurna.pt" || { echo "Missing checkpoint: $d"; exit 1; }
            python tools/merge_chakra.py --input "checkpoints/$d/ckpt/sampurna.pt" --state out/merge_state.pt --domain "$d" --source-run-id "$RUN_ID"
            rm -rf "checkpoints/$d"
          done
          python tools/merge_chakra.py --finalize-only --state out/merge_state.pt --final-output out/merged_model.pt --report out/merge_report.json
          test -s out/merged_model.pt
      - name: strict-load and next-token inference smoke test
        run: |
          set -euo pipefail
          python tools/smoke_merged.py --ckpt out/merged_model.pt --out out/smoke_report.json
      - name: publish experimental merged model and reports
        uses: actions/upload-artifact@v4
        with:
          name: chakra-merged-experimental-\${{ steps.source.outputs.run_id }}
          path: |
            out/merged_model.pt
            out/merge_report.json
            out/smoke_report.json
          retention-days: 90
