name: chakra_loop
on:
  push:
    branches: [main]
    paths:
      - "THAW_TRAINING_WORKFLOWS"

permissions:
  contents: write
  actions: write
jobs:
  train:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {domain: science, idx: 0}
          - {domain: math, idx: 1}
          - {domain: reasoning, idx: 2}
          - {domain: news, idx: 3}
          - {domain: qa, idx: 4}
          - {domain: general, idx: 5}
          - {domain: coding, idx: 6}
          - {domain: document, idx: 7}
          - {domain: history, idx: 8}
          - {domain: geography, idx: 9}
    runs-on: ubuntu-latest
    timeout-minutes: 295
    concurrency: chakra-${{ matrix.domain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          python -m pip install -q numpy pyarrow
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Qwen gyan laao
        run: |
          curl -sL -o emb_q.npz https://github.com/pdfusion9-cyber/hindi-lattice/releases/download/emb-v1/emb_q.npz
          ls -lh emb_q.npz
      - name: bring previous copy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python chakra_lo.py ${{ matrix.domain }} old || echo "purani copy nahi mili"
      - name: fetch data
        run: |
          set -o pipefail
          CYCLE=${{ inputs.cycle || 1 }}
          SHARD=$(( (CYCLE + ${{ matrix.idx }}) % 10 ))
          echo "cycle=$CYCLE shard=$SHARD"
          python loop_fetch.py --shard $SHARD --domain ${{ matrix.domain }}
          python to_text.py --dir data --out data/corpus.txt --max-chars 600000000
          wc -l data/corpus.txt
      - name: train full corpus
        run: |
          MIN=${{ inputs.minutes || 280 }}
          OLD=$(find old -name "*.pt" 2>/dev/null | head -1 || true)
          echo "old=[$OLD]"
          if [ -n "$OLD" ]; then
            python punah.py --old "$OLD" --data data/corpus.txt --emb emb_q.npz --dim 1024 --layers 12 --heads 16 --seq 16 --batch 8 --lr 1e-4 --vocab 30000 --steps 500000 --budget $((MIN*60)) --ckpt ckpt/sampurna.pt --threads 4
          else
            python punah.py --data data/corpus.txt --emb emb_q.npz --dim 1024 --layers 12 --heads 16 --seq 16 --batch 8 --lr 1e-4 --vocab 30000 --steps 500000 --budget $((MIN*60)) --ckpt ckpt/sampurna.pt --threads 4
          fi
      - name: int4
        if: always()
        run: |
          mkdir -p store
          if [ -f ckpt/sampurna.pt ]; then python int4_karo.py --ckpt ckpt/sampurna.pt --out store/int4.npz || echo skip; fi
      - name: save
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chakra-${{ matrix.domain }}
          path: |
            ckpt/
            store/
          retention-days: 90
          overwrite: true
