name: Dhīr-2B Source Metadata Audit

on:
  push:
    branches: [neurocore-v0.3.2-canonical-20261122]
    paths:
      - 'models/neurocore_edge/audit_dhir2b_source.py'
      - '.github/workflows/dhir2b_source_metadata_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'huggingface_hub>=0.30' 'transformers>=4.57.3,<5' 'tokenizers>=0.21'
      - name: Audit official Dhīr-2B config and tokenizer
        env:
          DHIR_MODEL_ID: zenteiq-ai/Dhir-2B
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python models/neurocore_edge/audit_dhir2b_source.py
      - name: Upload immutable source audit
        if: always() && hashFiles('dhir2b_source_audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dhir2b-source-metadata-audit
          path: dhir2b_source_audit.json
          if-no-files-found: error
