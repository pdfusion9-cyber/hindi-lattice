name: IndicCorpV2 Hindi Bounded Sample Audit

on:
  push:
    branches: [neurocore-v0.3.2-canonical-20261122]
    paths:
      - 'models/neurocore_edge/audit_indiccorp_hindi_sample.py'
      - 'models/neurocore_edge/test_audit_indiccorp_hindi_sample.py'
      - '.github/workflows/indiccorp_hindi_sample_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-sample-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install review-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'datasets>=3.2,<5' 'huggingface_hub>=0.30'
      - name: Run audit unit tests
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_audit_indiccorp_hindi_sample
      - name: Stream a bounded Hindi sample without saving text
        working-directory: models/neurocore_edge
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python audit_indiccorp_hindi_sample.py \
            --revision 2d7285e6ce14fdb3fb2449c9f89427b9f582ac3f \
            --max-rows 500 \
            --confirm-review-only > indiccorp_hindi_review_report.json
          cat indiccorp_hindi_review_report.json
      - name: Upload aggregate-only review report
        if: always() && hashFiles('models/neurocore_edge/indiccorp_hindi_review_report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: indiccorp-hindi-bounded-review
          path: models/neurocore_edge/indiccorp_hindi_review_report.json
          retention-days: 30
          if-no-files-found: error
