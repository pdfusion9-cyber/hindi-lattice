name: loop10
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: training minutes
        default: "240"
  schedule:
    - cron: '0 */5 * * *'
permissions:
  contents: write
jobs:
  train:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {domain: science, shard: 0}
          - {domain: math, shard: 1}
          - {domain: reasoning, shard: 2}
          - {domain: news, shard: 3}
          - {domain: qa, shard: 4}
          - {domain: general, shard: 5}
          - {domain: coding, shard: 6}
          - {domain: document, shard: 7}
          - {domain: history, shard: 8}
          - {domain: geography, shard: 9}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency: loop10-${{ matrix.domain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          python -m pip install -q numpy pyarrow
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: restore
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ckpt-${{ matrix.domain }}
          path: ckpt
      - name: fetch data
        run: |
          python loop_fetch.py --shard ${{ matrix.shard }} --domain ${{ matrix.domain }}
          python to_text.py --dir data --out data/corpus.txt --max-chars 150000000
          wc -l data/corpus.txt
      - name: build lattice pack
        run: |
          python pack_banao.py --text data/corpus.txt --out data/gyaan.pack --max-paths 300000
          ls -lh data/gyaan.pack
      - name: train from lattice pack
        run: |
          MIN=${{ inputs.minutes || 240 }}
          python sampurna2.py --pack data/gyaan.pack --facts data/gyaan.txt \
            --dim 512 --layers 4 --heads 8 --seq 24 --batch 16 \
            --steps 500000 --budget $((MIN*60)) --nbr 8 --cand 50 --pat-cand 20 \
            --ckpt ckpt/sampurna.pt --threads 4 2>&1 | tail -90
      - name: make int8 and int4
        if: always()
        run: |
          python chhota_karo.py --ckpt ckpt/sampurna.pt --out store --part-mb 90 || echo "quantize skipped"
          ls -lh store/ | head -20
      - name: save checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckpt-${{ matrix.domain }}
          path: ckpt/
          retention-days: 30
          overwrite: true
      - name: save small parts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: small-${{ matrix.domain }}
          path: store/
          retention-days: 90
          overwrite: true
      - name: branch
        if: always()
        run: |
          git config user.email bot@local
          git config user.name loop10
          git checkout -B shard-${{ matrix.domain }}
          git add -A
          git commit -m "loop10 ${{ matrix.domain }} pack-connected $(date -u +%H:%M)" || echo nochange
          git push -f origin shard-${{ matrix.domain }} || echo pushskip
