name: loop10
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: training minutes
        default: "250"
  schedule:
    - cron: '0 */5 * * *'
permissions:
  contents: write
concurrency:
  group: loop10-${{ matrix.domain }}
  cancel-in-progress: false
jobs:
  train:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        domain: [science, math, reasoning, news, qa, general, coding, document, history, geography]
        include:
          - domain: science
            shard: 0
          - domain: math
            shard: 1
          - domain: reasoning
            shard: 2
          - domain: news
            shard: 3
          - domain: qa
            shard: 4
          - domain: general
            shard: 5
          - domain: coding
            shard: 6
          - domain: document
            shard: 7
          - domain: history
            shard: 8
          - domain: geography
            shard: 9
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          python -m pip install -q numpy pyarrow
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(torch.__version__)"
      - name: restore
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ckpt-${{ matrix.domain }}
          path: ckpt
      - name: fetch
        run: |
          python loop_fetch.py --shard ${{ matrix.shard }} --domain ${{ matrix.domain }} --files 6
          python to_text.py --dir data --out data/corpus.txt --max-chars 200000000
          wc -l data/corpus.txt
      - name: train
        run: |
          MIN=${{ inputs.minutes || 250 }}
          python jaal_tf.py --data data/corpus.txt --vocab 30000 --dim 256 --layers 2 --heads 8 --seq 24 --batch 24 --steps 500000 --nbr 8 --use-lattice 1 --budget $((MIN*60)) --ckpt ckpt/jaal.pt --threads 4 2>&1 | tail -80
      - name: save
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckpt-${{ matrix.domain }}
          path: ckpt/
          retention-days: 90
          overwrite: true
      - name: branch
        if: always()
        run: |
          mkdir -p store
          cp -r ckpt/* store/ 2>/dev/null || true
          cp data/gyaan.txt store/gyaan.txt 2>/dev/null || true
          cp data/baat.txt store/baat.txt 2>/dev/null || true
          git config user.email bot@local
          git config user.name loop10
          git checkout -B shard-${{ matrix.domain }}
          git add -f store/ 2>/dev/null || true
          git commit -m "loop10 ${{ matrix.domain }} $(date -u +%H:%M)" 2>/dev/null || echo nochange
          git push -f origin shard-${{ matrix.domain }} 2>&1 | tail -3 || echo pushskip
