name: loop10

# FROZEN by request: no training and no scheduled runs.
# The workflow-file push launches a short sentinel matrix to cancel
# any older loop10 jobs via the existing per-domain concurrency keys.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/loop10.yml"

permissions:
  actions: read
  contents: read

jobs:
  train:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {domain: science}
          - {domain: math}
          - {domain: reasoning}
          - {domain: news}
          - {domain: qa}
          - {domain: general}
          - {domain: coding}
          - {domain: document}
          - {domain: history}
          - {domain: geography}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: loop10-${{ matrix.domain }}
      cancel-in-progress: true
    steps:
      - name: Freeze runner slot
        run: |
          echo "FROZEN: ${{ matrix.domain }} training is disabled."
          echo "No data fetch, training, quantization, merge, or checkpoint upload will run."

  merge:
    if: false
    needs: train
    runs-on: ubuntu-latest
    steps:
      - run: echo "Disabled while training is frozen."
