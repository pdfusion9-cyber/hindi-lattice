name: NeuroCore Relation-Balanced Word Prediction Resume

on:
  push:
    branches: [feat/hybrid-micro-agent-architecture-20261123]
    paths:
      - '.github/workflows/neurocore_word_prediction_resume.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  resume-word-prediction:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hybrid-micro-agent-architecture-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6'
      - name: Download verified 5,000-step native checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45414076752 \
            --repo "${{ github.repository }}" \
            --name neurocore-relation-balanced-hindi-word-prediction-5000 \
            --dir resume_artifact
          test -s resume_artifact/artifacts/neurocore-word-prediction-balanced-5000.pt
          test -s resume_artifact/artifacts/neurocore-hindi-word-tokenizer-balanced.json
      - name: Validate resume code and corpus identity
        run: |
          python -m py_compile tools/neurocore_native_word_prediction_resume.py
          test "$(git rev-parse HEAD:data/gyaan_base.txt)" = "3018157a78e6a35877e114b9297f8ae9e16a76ae"
      - name: Continue native relation-balanced word prediction on CPU
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python tools/neurocore_native_word_prediction_resume.py \
            --corpus data/gyaan_base.txt \
            --resume-checkpoint resume_artifact/artifacts/neurocore-word-prediction-balanced-5000.pt \
            --tokenizer resume_artifact/artifacts/neurocore-hindi-word-tokenizer-balanced.json \
            --steps 3000 \
            --batch-size 16 \
            --cpu-threads 2 \
            --learning-rate 0.00005 \
            --report reports/neurocore-word-prediction-balanced-8000.json \
            --checkpoint artifacts/neurocore-word-prediction-balanced-8000.pt
      - name: Verify resumed model, validation and provenance
        run: |
          python - <<'PY'
          import json, math, torch
          p = json.load(open("reports/neurocore-word-prediction-balanced-8000.json", encoding="utf-8"))
          t = p["training"]
          m = t["best_validation"]
          assert p["status"] == "NEUROCORE_NATIVE_RELATION_BALANCED_WORD_RESUME_PASS"
          assert t["resumed_from_step"] == 5000 and t["additional_steps"] == 3000 and t["total_steps"] == 8000
          assert p["vocabulary"]["size"] == 8700
          assert p["corpus"]["validation_rows"] >= 100
          assert p["corpus"]["relation_groups"] >= 20
          assert math.isfinite(m["object_word_loss"])
          assert 0 <= m["object_word_top1"] <= 1 and 0 <= m["object_word_top5"] <= 1
          assert 0 <= m["exact_object_match"] <= 1
          assert p["provenance"]["external_model_weights_used"] is False
          assert p["provenance"]["open_source_model_integrated"] is False
          assert p["production_training_gate"] == "CLOSED"
          ck = torch.load("artifacts/neurocore-word-prediction-balanced-8000.pt", map_location="cpu", weights_only=True)
          assert ck["step"] == 8000
          assert ck["model_id"] == "neurocore_edge_native_reference_word_balanced_v2"
          assert ck["production_training_gate"] == "CLOSED"
          print(json.dumps({
              "initial_loss": t["initial_validation"]["object_word_loss"],
              "best_loss": m["object_word_loss"],
              "best_top1": m["object_word_top1"],
              "best_top5": m["object_word_top5"],
              "best_exact_object_match": m["exact_object_match"],
              "final_loss": t["final_validation"]["object_word_loss"],
              "total_steps": t["total_steps"],
              "production_gate": p["production_training_gate"]
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload resumed model, tokenizer and metrics
        uses: actions/upload-artifact@v4
        with:
          name: neurocore-relation-balanced-hindi-word-prediction-8000
          path: |
            artifacts/neurocore-word-prediction-balanced-8000.pt
            resume_artifact/artifacts/neurocore-hindi-word-tokenizer-balanced.json
            reports/neurocore-word-prediction-balanced-8000.json
          if-no-files-found: error
          retention-days: 30
