name: fold
on:
  workflow_dispatch:
    inputs:
      steps:
        default: "200000"
      vocab:
        default: "50000"
permissions:
  contents: write
concurrency:
  group: fold
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          python -m pip install -q numpy pyarrow
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(torch.__version__)"
      - name: data
        run: |
          python fetch_hindi.py --shard 0 --rows 400000 --out data/web.txt || echo "web failed"
          python prep.py --articles 60000 --out data/wiki.txt || echo "wiki failed"
          cat data/wiki.txt data/web.txt > data/corpus.txt 2>/dev/null || cat data/wiki.txt > data/corpus.txt
          wc -l data/corpus.txt
      - name: restore
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fold-ckpt
          path: ckpt
      - name: train fold
        run: |
          python fold2.py --data data/corpus.txt --vocab ${{ inputs.vocab || 50000 }} \
            --dim 256 --layers 4 --steps ${{ inputs.steps || 200000 }} \
            --batch 24 --seq 64 --cand 50 2>&1 | tail -40
      - name: save
        uses: actions/upload-artifact@v4
        with:
          name: fold-ckpt
          path: ckpt/
          retention-days: 90
          overwrite: true
