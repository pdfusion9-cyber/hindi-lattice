name: code_200
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  banao:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          python -m pip install -q numpy tokenizers
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Qwen laao
        run: |
          curl -sL -o m.safetensors https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/model.safetensors
          curl -sL -o tok.json https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/tokenizer.json
      - name: shard ${{ matrix.shard }}
        run: python code_gen.py --shard ${{ matrix.shard }} --total 8 --maxnew 110
      - name: save
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/
          retention-days: 30
          overwrite: true

  jodo:
    needs: banao
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sab shard utaaro
        uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: shard-*
          merge-multiple: true
      - name: jodo aur test
        run: |
          mkdir -p in
          cp dl/*.json in/ 2>/dev/null || echo "koi json nahi"
          ls -la in/
          python code_merge.py
