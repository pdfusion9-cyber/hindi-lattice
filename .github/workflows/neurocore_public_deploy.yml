name: NeuroCore Deploy Public CPU Bundle

on:
  push:
    branches: [main]
    paths:
      - 'dist/neurocore-edge-pytorch-v0.3.2.tar.gz.sha256'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: neurocore-bundle-deploy
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reassemble exact package and verify SHA-256
        run: |
          set -euo pipefail
          PARTS='dist/neurocore-edge-pytorch-v0.3.2.tar.gz.b64.parts'
          test -s dist/neurocore-edge-pytorch-v0.3.2.tar.gz.sha256
          : > /tmp/neurocore-edge-v0.3.2.tar.gz.b64
          for part in 000 001 002 003 004 005 006 007; do
            test -s "$PARTS/$part"
            cat "$PARTS/$part" >> /tmp/neurocore-edge-v0.3.2.tar.gz.b64
          done
          base64 -d /tmp/neurocore-edge-v0.3.2.tar.gz.b64 > /tmp/neurocore-edge-v0.3.2.tar.gz
          expected="$(awk '{print $1}' dist/neurocore-edge-pytorch-v0.3.2.tar.gz.sha256)"
          echo "$expected  /tmp/neurocore-edge-v0.3.2.tar.gz" | sha256sum -c -
          tar -tzf /tmp/neurocore-edge-v0.3.2.tar.gz > /tmp/neurocore-edge-files.txt
          grep -q 'models/neurocore_edge/modeling.py' /tmp/neurocore-edge-files.txt
          grep -q '.github/workflows/neurocore_public_experts.yml' /tmp/neurocore-edge-files.txt
          mkdir -p /tmp/neurocore-edge-unpack
          tar -xzf /tmp/neurocore-edge-v0.3.2.tar.gz -C /tmp/neurocore-edge-unpack
          echo "NEUROCORE_ARCHIVE_SHA256_PASS $expected"
      - name: Install CPU PyTorch and package test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6'
          python -m pip install 'tokenizers>=0.19' pytest pyyaml datasets
      - name: Run all package tests before modifying main
        working-directory: /tmp/neurocore-edge-unpack
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: |
          set -euo pipefail
          cd models/neurocore_edge
          python -m pytest -q test_*.py
          python -m py_compile *.py
          python parameter_audit.py --config config.json --out /tmp/neurocore-parameter-audit.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/neurocore-parameter-audit.json'))
          assert p['status']=='META_DEVICE_PARAMETER_AUDIT_PASS'
          assert p['parameters']['total_parameters']==3074885656
          assert p['parameters']['shared_parameters']==872876056
          assert p['parameters']['expert_parameters']==2202009600
          assert p['experts']==20 and p['active_experts_per_token']==2
          assert p['tensor_key_count']==683
          print('PARAMETER_BUDGET_PASS', p['parameters'])
          PY
      - name: Verify dataset gate remains closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('/tmp/neurocore-edge-unpack/models/neurocore_edge/dataset_approval.json'))
          assert p['status']=='ALL_DATASETS_PENDING_REVIEW'
          assert all(row.get('approved') is False for row in p['datasets'])
          print('DATASET_GATE_CLOSED: no dataset has training approval')
          PY
      - name: Install model source, tests, docs, and public runner workflows
        run: |
          set -euo pipefail
          SRC=/tmp/neurocore-edge-unpack
          rm -rf models/neurocore_edge
          mkdir -p models docs/neurocore_edge .github/workflows
          cp -a "$SRC/models/neurocore_edge" models/
          cp "$SRC"/.github/workflows/neurocore_public_*.yml .github/workflows/
          cp "$SRC/README.md" docs/neurocore_edge/README.md
          cp "$SRC/INSTALL_AND_TRAIN.md" docs/neurocore_edge/INSTALL_AND_TRAIN.md
          cp "$SRC/TEST_RESULTS.txt" docs/neurocore_edge/TEST_RESULTS.txt
          # Remove the earlier incomplete manual transfer attempts.
          rm -f dist/neurocore-edge-v0.3.2.tar.gz.b64.000 dist/neurocore-edge-v0.3.2.tar.gz.b64.001 dist/neurocore-edge-v0.3.2.tar.gz.b64.002
          rm -rf dist/neurocore-edge-pytorch-v0.3.2.tar.gz.b64.parts
          rm -f dist/neurocore-edge-pytorch-v0.3.2.tar.gz.sha256
          git add models/neurocore_edge docs/neurocore_edge .github/workflows/neurocore_public_*.yml dist
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Deploy NeuroCore-Edge PyTorch public CPU package v0.3.2'
          git push origin HEAD:main
      - name: Launch public 20-runner preflight and package CI
        run: |
          set -euo pipefail
          gh workflow run neurocore_public_preflight.yml --repo "$GH_REPO" --ref main
          gh workflow run neurocore_public_tests.yml --repo "$GH_REPO" --ref main
          echo 'Dispatched 20-job public CPU preflight and separate PyTorch CI.'
          echo 'Dataset approval is still pending, so no training workflow is dispatched.'
