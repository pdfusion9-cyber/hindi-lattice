name: graph-transformer
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: |
          pip install --quiet numpy pyarrow tokenizers
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch,tokenizers;print('ok',torch.__version__)"
      - name: corpus
        run: |
          set +e
          curl -sL -o tokenizer.json "https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/tokenizer.json"
          curl -sL -o w1.parquet "https://huggingface.co/datasets/Salesforce/wikitext/resolve/main/wikitext-103-raw-v1/train-00000-of-00002.parquet"
          curl -sL -o w2.parquet "https://huggingface.co/datasets/Salesforce/wikitext/resolve/main/wikitext-103-raw-v1/train-00001-of-00002.parquet"
          ls -lh tokenizer.json w1.parquet w2.parquet
          python -c "import os;print('total bytes',os.path.getsize('w1.parquet')+os.path.getsize('w2.parquet'))"
      - name: run
        run: |
          set -o pipefail
          python -u qwen_big.py 2>&1 | tee run.log
      - name: show
        if: always()
        run: tail -30 run.log 2>/dev/null || true
