name: graph-transformer
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: |
          pip install --quiet numpy pyarrow tokenizers
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch,tokenizers;print('ok',torch.__version__)"
      - name: corpus
        run: |
          set +e
          curl -sL -o sh.txt "https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt"
          curl -sL -o wt.parquet "https://huggingface.co/datasets/Salesforce/wikitext/resolve/main/wikitext-2-raw-v1/train-00000-of-00001.parquet"
          curl -sL -o tokenizer.json "https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/tokenizer.json"
          ls -lh sh.txt wt.parquet tokenizer.json
          python - <<'EOF'
          import pyarrow.parquet as pq
          t=pq.read_table('wt.parquet'); col=t.column_names[0]
          txt="\n".join(str(x) for x in t.column(col).to_pylist())
          open('wt.txt','w').write(txt)
          print('wikitext chars',len(txt))
          EOF
      - name: run
        run: |
          set -o pipefail
          python -u qwen_lattice.py 2>&1 | tee run.log
      - name: show
        if: always()
        run: tail -30 run.log 2>/dev/null || true
