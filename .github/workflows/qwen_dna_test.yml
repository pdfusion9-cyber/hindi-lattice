name: qwen-dna-test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install torch (cpu)
        run: |
          python -m pip install --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy tokenizers
          python -c "import torch;print('torch',torch.__version__)"

      - name: free disk + ram check
        run: |
          df -h / | tail -1
          free -g

      - name: download Qwen 0.5B
        run: |
          curl -sL -o model.safetensors \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/model.safetensors"
          curl -sL -o config.json \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/config.json"
          curl -sL -o tokenizer.json \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/tokenizer.json"
          echo ok
          ls -lh model.safetensors config.json tokenizer.json
          cat config.json

      - name: run DNA pipeline
        run: |
          python -u mix_test.py 2>&1 | tee run.log

      - name: show result
        if: always()
        run: |
          echo "===== RESULT ====="
          cat result.json 2>/dev/null || echo "no result.json"
          echo "===== TAIL LOG ====="
          tail -40 run.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-dna-result
          path: |
            result.json
            run.log
          if-no-files-found: warn
