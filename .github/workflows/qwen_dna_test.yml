name: qwen-dna-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet numpy
      - name: download Qwen 0.5B
        run: |
          curl -sL -o model.safetensors "https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/model.safetensors"
          ls -lh model.safetensors
      - name: run residual VQ test
        run: python -u resid_vq.py 2>&1 | tee run.log
      - name: show
        if: always()
        run: tail -40 run.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result
          path: run.log
          if-no-files-found: warn
