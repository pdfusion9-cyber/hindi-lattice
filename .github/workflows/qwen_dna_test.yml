name: qwen-dna-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy tokenizers
      - name: download model + corpus
        run: |
          curl -sL -o model.safetensors "https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/model.safetensors"
          curl -sL -o config.json "https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/config.json"
          curl -sL -o tokenizer.json "https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/tokenizer.json"
          curl -sL -o c1.txt "https://www.gutenberg.org/cache/epub/11/pg11.txt"
          curl -sL -o c2.txt "https://www.gutenberg.org/cache/epub/1661/pg1661.txt"
          curl -sL -o c3.txt "https://www.gutenberg.org/cache/epub/84/pg84.txt"
          cat c1.txt c2.txt c3.txt > corpus.txt 2>/dev/null || true
          ls -lh model.safetensors corpus.txt
          python -c "import os;s=os.path.getsize('corpus.txt');print('corpus bytes',s);assert s>200000,'corpus too small'"
      - name: run QAT
        run: python -u qat2.py 2>&1 | tee run.log
      - name: show
        if: always()
        run: tail -40 run.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result
          path: |
            result.json
            run.log
          if-no-files-found: warn
