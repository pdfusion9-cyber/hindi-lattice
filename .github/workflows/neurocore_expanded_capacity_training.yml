name: NeuroCore Expanded Capacity Warm-Start CPU Experiment

on:
  push:
    branches: [feat/hybrid-micro-agent-architecture-20261123]
    paths:
      - 'tools/neurocore_native_corpus_training.py'
      - '.github/workflows/neurocore_expanded_capacity_training.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  expanded-capacity-warm-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hybrid-micro-agent-architecture-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6'
      - name: Download verified 6,000-step native checkpoint
        uses: actions/download-artifact@v4
        with:
          name: neurocore-native-hindi-corpus-resumed-6000-steps
          repository: pdfusion9-cyber/hindi-lattice
          run-id: 45379361657
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Verify corpus and source checkpoint
        run: |
          test "$(git rev-parse HEAD:data/gyaan_base.txt)" = "3018157a78e6a35877e114b9297f8ae9e16a76ae"
          python -m py_compile tools/neurocore_native_corpus_training.py
          python - <<'PY'
          import torch
          p=torch.load("artifacts/neurocore-corpus-checkpoint-6000.pt",map_location="cpu",weights_only=True)
          assert p["step"] == 6000
          assert p["config"]["hidden_size"] == 32
          assert p["corpus_git_blob_sha1"] == "3018157a78e6a35877e114b9297f8ae9e16a76ae"
          assert p["provenance"]["external_model_weights_used"] is False
          assert p["provenance"]["open_source_model_integrated"] is False
          print("source_checkpoint_step=",p["step"])
          PY
      - name: Warm-start expanded native NeuroCore and train 2,500 steps
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python tools/neurocore_native_corpus_training.py \
            --corpus data/gyaan_base.txt \
            --capacity-profile expanded \
            --expand-from-checkpoint artifacts/neurocore-corpus-checkpoint-6000.pt \
            --steps 2500 \
            --batch-size 8 \
            --sequence-length 64 \
            --cpu-threads 2 \
            --learning-rate 0.00015 \
            --report reports/neurocore-expanded-capacity-training.json \
            --checkpoint artifacts/neurocore-expanded-capacity-checkpoint-2500.pt
      - name: Verify expanded model, warm-start provenance and checkpoint
        run: |
          python - <<'PY'
          import json, os, torch
          p=json.load(open("reports/neurocore-expanded-capacity-training.json",encoding="utf-8"))
          assert p["status"] == "NEUROCORE_NATIVE_REAL_CORPUS_EXPERIMENT_PASS"
          assert p["capacity_profile"] == "expanded"
          assert p["capacity_warm_start"]["source_step"] == 6000
          assert p["capacity_warm_start"]["source_parameter_count"] > 0
          assert p["capacity_warm_start"]["target_parameter_count"] > p["capacity_warm_start"]["source_parameter_count"]
          assert p["capacity_warm_start"]["copied_tensor_count"] > 0
          assert p["training"]["steps"] == 2500
          assert p["training"]["total_steps"] == 2500
          assert p["corpus"]["git_blob_sha1"] == "3018157a78e6a35877e114b9297f8ae9e16a76ae"
          assert p["provenance"]["external_model_weights_used"] is False
          assert p["provenance"]["open_source_model_integrated"] is False
          assert p["production_training_gate"] == "CLOSED"
          ck=torch.load("artifacts/neurocore-expanded-capacity-checkpoint-2500.pt",map_location="cpu",weights_only=True)
          assert ck["step"] == 2500
          assert ck["capacity_profile"] == "expanded"
          print(json.dumps({
            "status":p["status"],
            "source_checkpoint_step":p["capacity_warm_start"]["source_step"],
            "copied_tensors":p["capacity_warm_start"]["copied_tensor_count"],
            "copied_parameter_numel":p["capacity_warm_start"]["copied_parameter_numel"],
            "old_parameters":p["capacity_warm_start"]["source_parameter_count"],
            "expanded_parameters":p["model_parameter_count"],
            "steps":p["training"]["steps"],
            "initial_validation_loss":p["training"]["initial_validation_loss"],
            "final_validation_loss":p["training"]["final_validation_loss"],
            "tokens_per_second":p["training"]["training_tokens_per_second"],
            "checkpoint_bytes":os.path.getsize("artifacts/neurocore-expanded-capacity-checkpoint-2500.pt"),
            "production_gate":"CLOSED"
          },indent=2))
          PY
      - name: Upload expanded native checkpoint and metrics
        uses: actions/upload-artifact@v4
        with:
          name: neurocore-expanded-capacity-warmstart-2500-steps
          path: |
            artifacts/neurocore-expanded-capacity-checkpoint-2500.pt
            reports/neurocore-expanded-capacity-training.json
          if-no-files-found: error
          retention-days: 30
