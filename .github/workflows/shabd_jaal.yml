name: shabd_jaal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chalao:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: python -m pip install -q numpy
      - name: Qwen laao
        run: |
          curl -sL -o m.safetensors https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/model.safetensors
          ls -lh m.safetensors
      - name: shabd taalka ko jaal banao
        run: python shabd_jaal.py
