name: NeuroCore Native Hindi Corpus CPU Training

on:
  push:
    branches: [feat/hybrid-micro-agent-architecture-20261123]
    paths:
      - 'tools/neurocore_native_corpus_training.py'
      - 'data/gyaan_base.txt'
      - '.github/workflows/neurocore_native_corpus_training.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-hindi-corpus-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hybrid-micro-agent-architecture-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6'
      - name: Verify pinned corpus and compile trainer
        run: |
          test "$(git rev-parse HEAD:data/gyaan_base.txt)" = "3018157a78e6a35877e114b9297f8ae9e16a76ae"
          python -m py_compile tools/neurocore_native_corpus_training.py
      - name: Train native NeuroCore shared backbone on Hindi project corpus
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python tools/neurocore_native_corpus_training.py \
            --corpus data/gyaan_base.txt \
            --steps 1000 \
            --batch-size 8 \
            --sequence-length 64 \
            --cpu-threads 2 \
            --report reports/neurocore-corpus-training.json \
            --checkpoint artifacts/neurocore-corpus-checkpoint.pt
      - name: Verify genuine corpus training outputs and native-only provenance
        run: |
          python - <<'PY'
          import json, os, torch
          report=json.load(open("reports/neurocore-corpus-training.json", encoding="utf-8"))
          assert report["status"] == "NEUROCORE_NATIVE_REAL_CORPUS_EXPERIMENT_PASS"
          assert report["training_started"] is True
          assert report["training"]["steps"] == 1000
          assert report["corpus"]["valid_triples"] >= 7000
          assert report["corpus"]["git_blob_sha1"] == "3018157a78e6a35877e114b9297f8ae9e16a76ae"
          assert report["provenance"]["external_model_weights_used"] is False
          assert report["provenance"]["open_source_model_integrated"] is False
          assert report["corpus"]["production_approved"] is False
          assert report["production_training_gate"] == "CLOSED"
          ckpt=torch.load("artifacts/neurocore-corpus-checkpoint.pt", map_location="cpu", weights_only=True)
          assert ckpt["step"] == 1000
          assert ckpt["corpus_git_blob_sha1"] == report["corpus"]["git_blob_sha1"]
          print(json.dumps({
            "status": report["status"],
            "steps": report["training"]["steps"],
            "initial_validation_loss": report["training"]["initial_validation_loss"],
            "final_validation_loss": report["training"]["final_validation_loss"],
            "tokens_per_second": report["training"]["training_tokens_per_second"],
            "checkpoint_bytes": os.path.getsize("artifacts/neurocore-corpus-checkpoint.pt"),
            "production_gate": "CLOSED"
          }, indent=2))
          PY
      - name: Upload native Hindi corpus checkpoint and report
        uses: actions/upload-artifact@v4
        with:
          name: neurocore-native-hindi-corpus-cpu-training
          path: |
            artifacts/neurocore-corpus-checkpoint.pt
            reports/neurocore-corpus-training.json
          if-no-files-found: error
          retention-days: 30
