name: expert-inference-adapter-tests
on:
  push:
    branches: [main]
    paths:
      - "tools/expert_inference.py"
      - "tests/test_expert_inference.py"
      - ".github/workflows/expert_inference_adapter_tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run synthetic checkpoint inference tests
        run: python -m unittest tests.test_expert_inference -v
