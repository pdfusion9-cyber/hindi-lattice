name: mlp_jaal3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chalao:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          python -m pip install -q numpy tokenizers
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Qwen laao
        run: |
          curl -sL -o m.safetensors https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/model.safetensors
          curl -sL -o tok.json https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/tokenizer.json
      - name: kosh
        run: |
          python - <<'PY'
          import urllib.request
          got = ""
          for u in ["https://www.gutenberg.org/cache/epub/2701/pg2701.txt",
                    "https://www.gutenberg.org/cache/epub/1342/pg1342.txt"]:
              try:
                  d = urllib.request.urlopen(u, timeout=90).read().decode("utf-8","ignore")
                  if len(d) > len(got): got = d
              except Exception: pass
          if len(got) < 200000:
              got = "def add(a, b): return a + b\nfor i in range(10): print(i)\n" * 20000
          open("corpus.txt","w",encoding="utf-8").write(got[:8000000])
          print("bytes", len(got))
          PY
      - name: samuh-war paimana
        run: python mlp_jaal3.py
