name: NeuroCore teacher assimilation tests

on:
  pull_request:
    paths:
      - "models/neurocore_edge/teacher_weight_assimilation.py"
      - "models/neurocore_edge/test_teacher_weight_assimilation.py"
      - "models/neurocore_edge/modeling_neurocore_edge.py"
      - ".github/workflows/neurocore-teacher-assimilation-tests.yml"
  push:
    branches:
      - "feat/external-open-weight-adoption-20261125"
    paths:
      - "models/neurocore_edge/teacher_weight_assimilation.py"
      - "models/neurocore_edge/test_teacher_weight_assimilation.py"
      - "models/neurocore_edge/modeling_neurocore_edge.py"
      - ".github/workflows/neurocore-teacher-assimilation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neurocore-teacher-assimilation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run teacher assimilation tests
        working-directory: models/neurocore_edge
        run: python -m unittest -v test_teacher_weight_assimilation.py
