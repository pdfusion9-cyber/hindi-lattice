name: punah10
on:
  workflow_dispatch:
    inputs:
      minutes:
        default: "230"
permissions:
  contents: write
  actions: read
jobs:
  train:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {domain: science, shard: 0}
          - {domain: math, shard: 1}
          - {domain: reasoning, shard: 2}
          - {domain: news, shard: 3}
          - {domain: qa, shard: 4}
          - {domain: general, shard: 5}
          - {domain: coding, shard: 6}
          - {domain: document, shard: 7}
          - {domain: history, shard: 8}
          - {domain: geography, shard: 9}
    runs-on: ubuntu-latest
    timeout-minutes: 290
    concurrency: punah-${{ matrix.domain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          python -m pip install -q numpy pyarrow
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: bring the old copy
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ckpt-${{ matrix.domain }}
          path: old
          run-id: 43263656655
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: show old
        run: |
          ls -lhR old/ | head -10
          find old -name "*.pt" | head -3
      - name: fetch data
        run: |
          python loop_fetch.py --shard ${{ matrix.shard }} --domain ${{ matrix.domain }}
          python to_text.py --dir data --out data/corpus.txt --max-chars 300000000
          wc -l data/corpus.txt
      - name: resume training
        run: |
          set -o pipefail
          MIN=${{ inputs.minutes || 230 }}
          OLD=$(find old -name "*.pt" | head -1)
          echo "old checkpoint: $OLD"
          python punah.py --old "$OLD" --data data/corpus.txt --dim 1024 --layers 12 --heads 16 --seq 16 --batch 8 --lr 1e-4 --vocab 30000 --steps 500000 --budget $((MIN*60)) --ckpt ckpt/sampurna.pt --threads 4
      - name: quantize
        if: always()
        run: |
          python int4_karo.py --ckpt ckpt/sampurna.pt --out store/int4.npz || echo "quantize skipped"
          ls -lh store/ ckpt/ 2>/dev/null | head -10
      - name: save
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: punah-${{ matrix.domain }}
          path: |
            ckpt/
            store/
          retention-days: 60
          overwrite: true
      - name: push result
        if: always()
        run: |
          mkdir -p store
          cp data/gyaan.txt store/ 2>/dev/null || true
          git config user.email bot@local
          git config user.name punah
          git checkout -B shard-${{ matrix.domain }}
          git add store/ ckpt/ 2>/dev/null || true
          git commit -m "punah ${{ matrix.domain }} $(date -u +%H:%M)" || echo nochange
          git push -f origin shard-${{ matrix.domain }} || echo pushskip
