name: facts
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: python -m pip install -q numpy
      - name: build dense facts (all domains)
        run: |
          python ghana_banao.py --domain sab --out data/gyaan_ghana.txt || echo "partial"
          wc -l data/gyaan_ghana.txt
      - name: merge with base
        run: |
          cat data/gyaan_ghana.txt data/gyaan_base.txt 2>/dev/null | sort -u > data/gyaan_sab.txt
          wc -l data/gyaan_sab.txt
      - name: commit facts branch
        run: |
          git config user.name "lattice-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan orphan-facts
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f data/gyaan_sab.txt data/gyaan_ghana.txt
          git commit -m "facts: $(date -u +%F) | $(wc -l < data/gyaan_sab.txt) triples" || echo "no change"
          git push -f origin "orphan-facts:refs/heads/facts"
