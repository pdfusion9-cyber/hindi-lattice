name: Dhīr-2B Expert 16 Held-out Baseline Evaluation

on:
  push:
    branches: [neurocore-v0.3.2-canonical-20261122]
    paths:
      - 'models/neurocore_edge/evaluate_dhir2b_expert.py'
      - '.github/workflows/dhir2b_expert16_heldout_evaluation.yml'
  workflow_dispatch:
    inputs:
      checkpoint_run_id:
        description: Successful run containing dhir2b-neurocore-cpu-checkpoint artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  heldout-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neurocore-v0.3.2-canonical-20261122
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download verified Dhīr-2B NeuroCore checkpoint
        uses: actions/download-artifact@v4
        with:
          name: dhir2b-neurocore-cpu-checkpoint
          run-id: ${{ inputs.checkpoint_run_id || '45780741273' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dhir2b-checkpoint-artifact
      - name: Install CPU-only Dhīr runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r models/neurocore_edge/requirements-dhir2b.txt
      - name: Run read-only held-out Expert 16 baseline evaluation
        working-directory: models/neurocore_edge
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          CHECKPOINT_MANIFEST="$(find "${{ runner.temp }}/dhir2b-checkpoint-artifact" -name manifest.json -type f -print -quit)"
          test -n "$CHECKPOINT_MANIFEST"
          MODEL_DIR="$(dirname "$CHECKPOINT_MANIFEST")"
          python -m py_compile evaluate_dhir2b_expert.py
          python evaluate_dhir2b_expert.py \
            --model-dir "$MODEL_DIR" \
            --validation-data synthetic_sft/expert16_self_correction_validation.jsonl \
            --output "${{ runner.temp }}/dhir2b-expert16-heldout/report.json" \
            --threads 2
      - name: Upload read-only evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhir2b-expert16-heldout-evaluation
          path: ${{ runner.temp }}/dhir2b-expert16-heldout/report.json
          if-no-files-found: ignore
          retention-days: 30
