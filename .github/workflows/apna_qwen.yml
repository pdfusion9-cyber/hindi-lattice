name: apna_qwen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chalao:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q tokenizers
      - name: Qwen laao
        run: |
          curl -sL -o m.safetensors https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/model.safetensors
          curl -sL -o tok.json https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/tokenizer.json
          ls -lh m.safetensors tok.json
      - name: apna code chalao
        run: python apna_qwen.py
