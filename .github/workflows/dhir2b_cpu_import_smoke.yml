name: Dhīr-2B Real CPU Weight Import Smoke Test

on:
  push:
    branches: [neurocore-v0.3.2-canonical-20261122]
    paths:
      - 'models/neurocore_edge/dhir2b_neurocore.py'
      - 'models/neurocore_edge/requirements-dhir2b.txt'
      - '.github/workflows/dhir2b_cpu_import_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-weight-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch and Dhīr dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r models/neurocore_edge/requirements-dhir2b.txt
      - name: Import pinned real Dhīr-2B weights on CPU
        working-directory: models/neurocore_edge
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_ENABLE_HF_TRANSFER: '0'
        run: |
          python - <<'PY'
          import gc, json, torch
          from dhir2b_neurocore import Dhir2BNeuroCore
          torch.set_num_threads(4)
          model_id = "zenteiq-ai/Dhir-2B"
          revision = "7cbe444cd1e45e25197cfa0f683b2cb575858169"
          model, tokenizer, loading_info = Dhir2BNeuroCore.import_pretrained(
              model_id=model_id, revision=revision, rank=8, dtype=torch.bfloat16
          )
          model.eval()
          import time
          # End-to-end NeuroCore inference: native Dhīr tokenizer, out-of-band
          # language/task metadata, mapped fixed expert adapter, learned Top-2
          # router path, and native autoregressive generation.
          inference_cases = [
              {"name": "hindi_indic_docs", "prompt": "भारत की भाषाओं और साहित्य का महत्व समझाइए।", "task": "hindi_indic_docs", "lang": "hi"},
              {"name": "technical_academic", "prompt": "Explain how photosynthesis converts light energy into chemical energy.", "task": "technical_academic", "lang": "en"},
              {"name": "self_correction", "prompt": "इस उत्तर की जाँच करें और यदि कोई गलती हो तो उसे सुधारें।", "task": "self_correction_mnl", "lang": "hi"},
              {"name": "planning", "prompt": "जल संरक्षण के लिए तीन चरणों की योजना बनाइए।", "task": "coconut_planning", "lang": "hi"},
          ]
          inference_reports = []
          for case in inference_cases:
              encoded_meta = tokenizer.encode_with_metadata(
                  case["prompt"], role="user", task=case["task"],
                  language_tag=case["lang"], return_tensors="pt"
              )
              inputs = encoded_meta["encoding"]
              metadata = encoded_meta["control_metadata"]
              selected_expert = metadata["suggested_expert_id"]
              assert selected_expert is not None
              start = time.perf_counter()
              with torch.inference_mode():
                  fixed = model.generate(**inputs, max_new_tokens=12, do_sample=False,
                                          expert_id=selected_expert)
              fixed_seconds = time.perf_counter() - start
              prompt_len = int(inputs["input_ids"].shape[-1])
              fixed_ids = fixed[0, prompt_len:]
              fixed_text = tokenizer.decode(fixed_ids, skip_special_tokens=True)
              # Exercise the native Top-2 routing path as a separate generation.
              start = time.perf_counter()
              with torch.inference_mode():
                  automatic = model.generate(**inputs, max_new_tokens=12, do_sample=False)
              top2_seconds = time.perf_counter() - start
              automatic_text = tokenizer.decode(automatic[0, prompt_len:], skip_special_tokens=True)
              inference_reports.append({
                  "case": case["name"], "task": case["task"],
                  "language_tag": case["lang"],
                  "script": encoded_meta["text_metadata"]["dominant_script"],
                  "tokenizer_vocab_unchanged": encoded_meta["token_ids_unchanged"],
                  "metadata_suggested_expert": selected_expert,
                  "metadata_expert_name": metadata["suggested_expert_name"],
                  "metadata_dispatch_policy": metadata["expert_selection_policy"],
                  "fixed_expert_generated_tokens": int(fixed_ids.numel()),
                  "fixed_expert_seconds": round(fixed_seconds, 4),
                  "fixed_expert_tokens_per_second": round(float(fixed_ids.numel()) / max(fixed_seconds, 1e-9), 3),
                  "fixed_expert_text": fixed_text,
                  "top2_generated_tokens": int(automatic.shape[-1] - prompt_len),
                  "top2_seconds": round(top2_seconds, 4),
                  "top2_text": automatic_text,
                  "finite_logits": bool(torch.isfinite(model(input_ids=inputs["input_ids"],
                      attention_mask=inputs.get("attention_mask"), use_cache=False,
                      expert_id=selected_expert).logits).all())
              })
          assert len(inference_reports) == len(inference_cases)
          assert all(x["tokenizer_vocab_unchanged"] and x["finite_logits"]
                     and x["fixed_expert_generated_tokens"] > 0
                     and x["top2_generated_tokens"] > 0 for x in inference_reports)
          # Exercise raw Dhīr and all 20 fixed expert paths independently.
          probe = tokenizer("भारत की भाषा और विज्ञान", return_tensors="pt")
          expert_reports = []
          with torch.inference_mode():
              raw = model.generate_base(**probe, max_new_tokens=4, do_sample=False)
              for expert_id in range(20):
                  generated = model.generate(**probe, max_new_tokens=4, do_sample=False,
                                             expert_id=expert_id)
                  logits = model(input_ids=probe["input_ids"],
                                 attention_mask=probe.get("attention_mask"),
                                 use_cache=False, expert_id=expert_id).logits
                  expert_reports.append({
                      "expert_id": expert_id,
                      "generated_tokens": int(generated.shape[-1] - probe["input_ids"].shape[-1]),
                      "finite": bool(torch.isfinite(logits).all()),
                      "exact_match_to_base_dhir": bool(torch.equal(generated, raw))
                  })
              top2_logits = model(input_ids=probe["input_ids"],
                                  attention_mask=probe.get("attention_mask"),
                                  use_cache=False).logits
              top2_router_finite = bool(torch.isfinite(top2_logits).all())
          assert len(expert_reports) == 20
          assert all(x["generated_tokens"] == 4 and x["finite"]
                     and x["exact_match_to_base_dhir"] for x in expert_reports)
          assert top2_router_finite
          token_id = tokenizer.bos_token_id if tokenizer.bos_token_id is not None else 2
          ids = torch.tensor([[token_id, token_id]], dtype=torch.long)
          mask = torch.ones_like(ids)
          with torch.inference_mode():
              output = model(input_ids=ids, attention_mask=mask, use_cache=False, expert_id=0)
          report = {
              "status": "REAL_DHIR_WEIGHTS_IMPORTED_AND_FORWARD_PASSED",
              "base_model_id": model_id,
              "base_revision": revision,
              "device": "cpu",
              "gpu_used": False,
              "dtype": str(next(model.backbone.parameters()).dtype),
              "num_hidden_layers": len(model.adapter_layers),
              "hidden_size": model.hidden_size,
              "vocab_size": model.vocab_size,
              "experts": model.num_experts,
              "experts_per_token": model.adapter_layers[0].top_k,
              "logits_shape": list(output.logits.shape),
              "logits_finite": bool(torch.isfinite(output.logits).all()),
              "loading_info_clean": not any(loading_info.get(k) for k in ("missing_keys", "unexpected_keys", "mismatched_keys", "error_msgs")),
              "weights_persisted": False,
              "training_performed": False,
              "end_to_end_neurocore_inference": {
                  "cases": len(inference_reports),
                  "tokenizer_metadata_fixed_expert_and_top2_generation_passed": True,
                  "results": inference_reports
              },
              "fixed_expert_generation_smoke": {
                  "experts_tested": len(expert_reports),
                  "all_20_generated_four_tokens": all(x["generated_tokens"] == 4 for x in expert_reports),
                  "all_20_logits_finite": all(x["finite"] for x in expert_reports),
                  "all_20_exact_match_to_base_dhir_before_training": all(x["exact_match_to_base_dhir"] for x in expert_reports),
                  "top2_router_path_finite": top2_router_finite,
                  "router_status": "UNTRAINED_NOT_QUALITY_VALIDATED",
                  "expert_reports": expert_reports
              }
          }
          print(json.dumps(report, indent=2))
          assert report["num_hidden_layers"] == 28
          assert report["vocab_size"] == 131072
          assert report["logits_shape"] == [1, 2, 131072]
          assert report["logits_finite"]
          with open("dhir2b_real_import_smoke.json", "w") as f:
              json.dump(report, f, indent=2)
          PY
      - name: Upload import smoke report only
        if: always() && hashFiles('models/neurocore_edge/dhir2b_real_import_smoke.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dhir2b-real-import-smoke-report
          path: models/neurocore_edge/dhir2b_real_import_smoke.json
          if-no-files-found: error
