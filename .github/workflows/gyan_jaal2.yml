name: gyan_jaal2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  banao:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          python -m pip install -q numpy tokenizers
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Qwen laao
        run: |
          curl -sL -o m.safetensors https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/model.safetensors
          curl -sL -o tok.json https://huggingface.co/Qwen/Qwen2.5-0.5B/resolve/main/tokenizer.json
      - name: asli kosh laao
        run: |
          python - <<'PY'
          import urllib.request
          urls = [
            "https://raw.githubusercontent.com/pdfusion9-cyber/hindi-lattice/main/hindi_corpus.txt",
            "https://www.gutenberg.org/files/11/11-0.txt",
          ]
          got = ""
          for u in urls:
              try:
                  d = urllib.request.urlopen(u, timeout=90).read().decode("utf-8","ignore")
                  if len(d) > 100000: got = d; print("mila:", u, len(d)); break
              except Exception as e:
                  print("skip", u, type(e).__name__)
          if not got:
              got = "The capital of India is New Delhi. Machine learning is a field of study. " * 4000
          open("corpus.txt","w",encoding="utf-8").write(got[:6000000])
          print("corpus bytes:", len(got))
          PY
          wc -c corpus.txt
      - name: jaal banao
        run: python gyan_jaal2.py
