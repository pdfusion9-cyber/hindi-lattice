name: chakra-expert-bank-export
on:
  push:
    branches: [main]
    paths:
      - "tools/package_chakra_expert.py"
      - ".github/workflows/chakra_expert_bank.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  package-expert:
    if: false # FROZEN: no CHAKRA training/runner jobs until explicitly thawed
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        domain: [science, math, reasoning, news, qa, general, coding, document, history, geography]
    env:
      SOURCE_RUN_ID: "44795411621"
      DOMAIN: ${{ matrix.domain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install CPU PyTorch
        run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: download original domain checkpoint
        uses: actions/download-artifact@v4
        with:
          name: chakra-${{ matrix.domain }}
          path: source
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: package lossless independent expert
        run: |
          set -euo pipefail
          test -s source/ckpt/sampurna.pt
          mkdir -p out
          python tools/package_chakra_expert.py \
            --input source/ckpt/sampurna.pt \
            --domain "$DOMAIN" \
            --source-run-id "$SOURCE_RUN_ID" \
            --out "out/$DOMAIN.expert.pt"
          # Keep each part safely below the 512 MiB connector download cap.
          split -b 300M -d -a 3 "out/$DOMAIN.expert.pt" "out/$DOMAIN.expert.part-"
          test -s "out/$DOMAIN.expert.part-000"
          test -s "out/$DOMAIN.expert.part-001"
          test -s "out/$DOMAIN.expert.part-002"
          sha256sum out/"$DOMAIN".expert.part-* > "out/$DOMAIN.SHA256SUMS"
          cp "out/$DOMAIN.expert.pt.json" "out/$DOMAIN.manifest.json"
          cat "out/$DOMAIN.manifest.json"
      - name: upload expert part 000
        uses: actions/upload-artifact@v4
        with:
          name: chakra-expert-${{ matrix.domain }}-part-000
          path: out/${{ matrix.domain }}.expert.part-000
          if-no-files-found: error
          retention-days: 90
      - name: upload expert part 001
        uses: actions/upload-artifact@v4
        with:
          name: chakra-expert-${{ matrix.domain }}-part-001
          path: out/${{ matrix.domain }}.expert.part-001
          if-no-files-found: error
          retention-days: 90
      - name: upload expert part 002
        uses: actions/upload-artifact@v4
        with:
          name: chakra-expert-${{ matrix.domain }}-part-002
          path: out/${{ matrix.domain }}.expert.part-002
          if-no-files-found: error
          retention-days: 90
      - name: upload expert manifest and part checksums
        uses: actions/upload-artifact@v4
        with:
          name: chakra-expert-${{ matrix.domain }}-manifest
          path: |
            out/${{ matrix.domain }}.manifest.json
            out/${{ matrix.domain }}.SHA256SUMS
          if-no-files-found: error
          retention-days: 90
