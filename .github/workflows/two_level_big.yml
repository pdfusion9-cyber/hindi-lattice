name: two-level-bigdata
on:
  workflow_dispatch:
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: pip install --quiet pyarrow
      - name: corpus (wikitext + shakespeare)
        run: |
          set +e
          curl -sL -o wt.parquet "https://huggingface.co/datasets/Salesforce/wikitext/resolve/main/wikitext-2-raw-v1/train-00000-of-00001.parquet"
          curl -sL -o sh.txt "https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt"
          ls -lh wt.parquet sh.txt
          python - <<'EOF'
          import pyarrow.parquet as pq, os
          t = pq.read_table('wt.parquet')
          col = t.column_names[0]
          lines = [str(x) for x in t.column(col).to_pylist()]
          txt = "\n".join(lines)
          open('wt.txt','w').write(txt)
          print('wikitext chars', len(txt))
          sh = open('sh.txt', encoding='utf-8', errors='ignore').read()
          total = txt + "\n" + sh
          open('c1.txt','w').write(total)
          print('TOTAL CHARS', len(total))
          assert len(total) > 4000000, 'too small'
          EOF
          rm -f c2.txt c3.txt
          ls -lh c1.txt
      - name: run
        run: python -u heavy2.py 2>&1 | tee run.log
      - name: show
        if: always()
        run: tail -30 run.log 2>/dev/null || true
