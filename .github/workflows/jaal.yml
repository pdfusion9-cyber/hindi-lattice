name: jaal
on:
  workflow_dispatch:
    inputs:
      steps:
        default: "280000"
      vocab:
        default: "20000"
permissions:
  contents: write
concurrency:
  group: jaal
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          python -m pip install -q numpy pyarrow
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(torch.__version__)"
      - name: data
        run: |
          python fetch_hindi.py --shard 0 --rows 400000 --out data/web.txt || echo "web failed"
          python prep.py --articles 60000 --out data/wiki.txt || echo "wiki failed"
          cat data/wiki.txt data/web.txt > data/corpus.txt 2>/dev/null || cat data/wiki.txt > data/corpus.txt
          wc -l data/corpus.txt
      - name: train jaal (with lattice)
        run: |
          python jaal_tf.py --data data/corpus.txt --vocab ${{ inputs.vocab || 20000 }} \
            --dim 256 --layers 2 --heads 8 --seq 24 --batch 24 \
            --steps ${{ inputs.steps || 280000 }} --nbr 8 --use-lattice 1 \
            --budget 14000 --ckpt ckpt/jaal.pt 2>&1 | tail -60
      - name: baseline (no lattice)
        run: |
          python jaal_tf.py --data data/corpus.txt --vocab ${{ inputs.vocab || 20000 }} \
            --dim 256 --layers 2 --heads 8 --seq 24 --batch 24 \
            --steps 30000 --nbr 8 --use-lattice 0 \
            --budget 600 --ckpt ckpt/base.pt 2>&1 | tail -20
