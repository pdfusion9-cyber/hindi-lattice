name: jaal
on:
  workflow_dispatch:
    inputs:
      minutes:
        default: "250"
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          python -m pip install -q numpy pyarrow
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: restore
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ckpt-jaal
          path: ckpt
      - name: data
        run: |
          python loop_fetch.py --shard 0 --domain science
          python to_text.py --dir data --out data/corpus.txt --max-chars 150000000
          wc -l data/corpus.txt
      - name: train sampurna with lattice
        run: |
          MIN=${{ inputs.minutes || 250 }}
          python sampurna.py --data data/corpus.txt --vocab 30000 --dim 512 --layers 4 --heads 8 --seq 24 --batch 16 --steps 500000 --nbr 8 --budget $((MIN*60)) --ckpt ckpt/sampurna.pt --threads 4 2>&1 | tail -60
      - name: save
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckpt-jaal
          path: ckpt/
          retention-days: 90
          overwrite: true
