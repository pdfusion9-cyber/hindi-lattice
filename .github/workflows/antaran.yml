name: antaran
on:
  workflow_dispatch:
    inputs:
      domain:
        description: which domain checkpoint to test
        default: "document"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          python -m pip install -q numpy pyarrow
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: restore trained checkpoint
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ckpt-${{ inputs.domain || 'document' }}
          path: ckpt
      - name: show checkpoint
        run: |
          echo "--- ckpt ---"
          ls -lhR ckpt/ || echo "ckpt खाली"
          du -sh ckpt/ 2>/dev/null || true
      - name: data
        run: |
          python loop_fetch.py --shard 7 --domain ${{ inputs.domain || 'document' }}
          python to_text.py --dir data --out data/corpus.txt --max-chars 60000000
          wc -l data/corpus.txt
      - name: transfer test
        run: |
          set -o pipefail
          python antaran_runner.py --ckpt ckpt/sampurna.pt --data data/corpus.txt --n-train 8000 --n-test 2000 --out store/antaran.json
      - name: show result
        if: always()
        run: |
          echo "--- store ---"
          ls -lh store/ || echo "store खाली"
          cat store/antaran.json 2>/dev/null || echo "json नहीं"
      - name: upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antaran-result
          path: store/
          retention-days: 90
          overwrite: true
      - name: branch
        if: always()
        run: |
          git config user.email bot@local
          git config user.name antaran
          git checkout -B antaran-result
          git add -A
          git commit -m "antaran result $(date -u +%H:%M)" || echo nochange
          git push -f origin antaran-result || echo pushskip
