name: train
on:
  workflow_dispatch:
    inputs:
      dim:
        description: "आयाम (64-1024)"
        default: "256"
      steps:
        description: "कुल कदम"
        default: "300000"
      articles:
        description: "विकिपीडिया लेख"
        default: "80000"
  schedule:
    - cron: "0 */6 * * *"
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cores
        run: nproc && free -g | head -2
      - name: deps
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__, 'threads', torch.get_num_threads())"
      - name: data
        run: |
          python prep.py --articles ${{ inputs.articles || 80000 }} --out data/corpus.txt
          wc -c data/corpus.txt
      - name: build lattice store
        run: python build_store.py --data data/corpus.txt --out store
      - name: restore checkpoint
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ckpt
          path: ckpt
      - name: train
        run: |
          python train_runner.py --data data/corpus.txt --ckpt ckpt/model.pt \
            --dim ${{ inputs.dim || 256 }} --steps ${{ inputs.steps || 300000 }} \
            --budget 15000 --threads 4
      - name: save checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: ckpt
          path: ckpt/
          retention-days: 90
          overwrite: true
      - name: commit store
        run: |
          git config user.name "lattice-bot"
          git config user.email "bot@users.noreply.github.com"
          git add store/ || true
          git commit -m "store: $(date -u +%F-%H%M) | $(wc -l < store/gyaan.txt) facts" || echo "no change"
          git push || true
