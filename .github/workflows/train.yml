name: train
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "डोमेन: science / math / reasoning / news / qa / general / coding"
        default: "science"
      dim:
        description: "आयाम"
        default: "256"
      steps:
        description: "कुल कदम"
        default: "300000"
      articles:
        description: "विकिपीडिया लेख"
        default: "40000"
  schedule:
    - cron: "0 */6 * * *"
permissions:
  contents: write
concurrency:
  group: shard-${{ github.event.inputs.domain || 'auto' }}
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cores
        run: nproc && free -g | head -2
      - name: deps
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q numpy
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import numpy, torch; print('numpy', numpy.__version__, '| torch', torch.__version__)"
      - name: foundation (coding/english)
        run: |
          python buniyad.py --out store
          wc -l store/gyaan_buniyad.txt store/path_buniyad.txt
      - name: data (domain)
        run: |
          python fetch_domain.py --domain ${{ inputs.domain || 'science' }} --out store --per-dataset 8000 || echo "dataset fetch failed -- foundation only"
          wc -l store/baat_*.txt
      - name: data (wikipedia)
        run: |
          python prep.py --articles ${{ inputs.articles || 40000 }} --out data/corpus.txt
          wc -c data/corpus.txt
      - name: build store
        run: |
          python build_store.py --data data/corpus.txt --out store
          cat store/gyaan_buniyad.txt >> store/gyaan.txt 2>/dev/null || true
          cat store/path_buniyad.txt >> data/corpus.txt 2>/dev/null || true
          wc -l store/gyaan.txt
      - name: build pack
        run: |
          python pack_banao.py --text data/corpus.txt --out store/gyaan.pack --max-paths 2000000
          ls -lh store/gyaan.pack
      - name: restore checkpoint
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ckpt-${{ inputs.domain || 'science' }}
          path: ckpt
      - name: train
        run: |
          python train_runner.py --data data/corpus.txt --ckpt ckpt/model.pt \
            --dim ${{ inputs.dim || 256 }} --steps ${{ inputs.steps || 300000 }} \
            --budget 13200 --threads 4 --max-mb 40
      - name: save checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: ckpt-${{ inputs.domain || 'science' }}
          path: ckpt/
          retention-days: 90
          overwrite: true
      - name: commit store to domain branch
        run: |
          set -x
          D="${{ inputs.domain || 'science' }}"
          git config user.name "lattice-bot"
          git config user.email "bot@users.noreply.github.com"
          # शुद्ध ब्रांच: सिर्फ़ store/, कोई वर्कफ़्लो फ़ाइल नहीं
          git checkout --orphan "orphan-$D"
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f store/
          git commit -m "shard $D: $(date -u +%F-%H%M) | $(wc -l < store/gyaan.txt 2>/dev/null) facts | $(cat store/baat_*.txt 2>/dev/null | wc -l) QA | pack $(du -h store/gyaan.pack 2>/dev/null | cut -f1)" || echo "no change"
          git push -f origin "orphan-$D:refs/heads/shard-$D"
