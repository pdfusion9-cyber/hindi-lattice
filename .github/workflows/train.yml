name: train
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "डोमेन: science/math/reasoning/news/qa/general/coding/document"
        default: "science"
      shard:
        description: "कर्सर (0-7)"
        default: "0"
      dim:
        description: "आयाम"
        default: "256"
      steps:
        description: "कुल कदम"
        default: "300000"
      articles:
        description: "विकिपीडिया लेख"
        default: "40000"
  schedule:
    - cron: "0 */6 * * *"
permissions:
  contents: write
concurrency:
  group: shard-${{ github.event.inputs.domain || 'auto' }}-${{ github.event.inputs.shard || '0' }}
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cores
        run: nproc && free -g | head -2
      - name: deps
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q numpy pyarrow
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import numpy, pyarrow, torch; print('numpy', numpy.__version__, '| torch', torch.__version__)"
      - name: foundation (coding/english)
        run: |
          python buniyad.py --out store
          wc -l store/gyaan_buniyad.txt store/path_buniyad.txt
      - name: data (domain)
        run: |
          D="${{ inputs.domain || 'science' }}"
          if [ "$D" = "coding" ]; then
            python fetch_code.py --out store --rows 25000 || echo "code fetch failed"
          else
            python fetch_domain.py --domain "$D" --out store --per-dataset 8000 --shard ${{ inputs.shard || 0 }} || echo "domain fetch failed"
          fi
          wc -l store/baat_*.txt
      - name: data (hindi web -- new slice)
        run: |
          if [ "${{ inputs.domain || 'science' }}" != "coding" ]; then
            python fetch_hindi.py --shard ${{ inputs.shard || 0 }} --rows 150000 --out data/web.txt || echo "web fetch failed"
          fi
          wc -l data/web.txt 2>/dev/null || true
      - name: data (wikipedia)
        run: |
          python prep.py --articles ${{ inputs.articles || 40000 }} --out data/wiki.txt
          wc -c data/wiki.txt
      - name: merge corpus
        run: |
          cat data/wiki.txt data/web.txt store/path_buniyad.txt > data/corpus.txt 2>/dev/null || cat data/wiki.txt > data/corpus.txt
          wc -l data/corpus.txt
      - name: build store (facts)
        run: |
          python build_store.py --data data/corpus.txt --out store
          cat data/gyaan_base.txt >> store/gyaan.txt 2>/dev/null || true
          cat store/gyaan_buniyad.txt >> store/gyaan.txt 2>/dev/null || true
          sort -u store/gyaan.txt -o store/gyaan.txt 2>/dev/null || true
          wc -l store/gyaan.txt
      - name: build pack
        run: |
          python pack_banao.py --text data/corpus.txt --out store/gyaan.pack --max-paths 2000000
          ls -lh store/gyaan.pack
      - name: restore checkpoint
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ckpt-${{ inputs.domain || 'science' }}
          path: ckpt
      - name: train (280 min)
        run: |
          python train_runner.py --data data/corpus.txt --ckpt ckpt/model.pt \
            --dim ${{ inputs.dim || 256 }} --steps ${{ inputs.steps || 300000 }} \
            --budget 16200 --threads 4 --max-mb 40
      - name: save checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: ckpt-${{ inputs.domain || 'science' }}
          path: ckpt/
          retention-days: 90
          overwrite: true
      - name: commit store to domain branch
        run: |
          set -x
          D="${{ inputs.domain || 'science' }}"
          S="${{ inputs.shard || 0 }}"
          git config user.name "lattice-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan "orphan-$D-$S"
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f store/
          git commit -m "shard $D/$S: $(date -u +%F-%H%M) | $(wc -l < store/gyaan.txt 2>/dev/null) facts | $(cat store/baat_*.txt 2>/dev/null | wc -l) QA | pack $(du -h store/gyaan.pack 2>/dev/null | cut -f1)" || echo "no change"
          git push -f origin "orphan-$D-$S:refs/heads/shard-$D"
